<!DOCTYPE html>

<head>

<body class="flex flex-col h-screen overflow-hidden font-sans bg-gray-100">

                <a href="index.html" class="menu-item">

                    <i class="fas fa-file-alt w-5 text-center text-gray-400"></i>

                </a>
                <a href="h2.html" class="menu-item">
                    <i class="fas fa-file-alt w-5 text-center text-gray-400"></i>

                    <i class="fas fa-file-alt w-5 text-center text-gray-400"></i>

        <main class="flex-1 bg-[#f0f2f5] relative w-full p-6 overflow-y-auto">

    <script src="script.js"></script>
